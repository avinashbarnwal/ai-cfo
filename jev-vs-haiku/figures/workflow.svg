3" fill="#6f6d68" font-weight="400" text-anchor="start" letter-spacing="0" style="">In 200 lines Haiku used only 14 distinct confidence values, 30% of them exactly 0.60, and never went above 0.95.</text><text x="48" y="766" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6f6d68" font-weight="400" text-anchor="start" letter-spacing="0" style="">A ≥ 0.95 rule would auto-post 6.5% of lines with Haiku and 18.5% with Jev.</text><text x="48" y="796" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#a8a49b" font-weight="400" text-anchor="start" letter-spacing="0" style="">Data: Kaggle “Bank Transaction Data” (apoorvwatsky), 200-line sample. Models: jev-latest (TypeSafe), claude-haiku-5-5 (Anthropic). Nov 2026.</text>
